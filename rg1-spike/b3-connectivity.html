<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>RG1 B3 — test du transport</title><body><p id="result">Test de connectivité synthétique en cours…</p><script>
(async () => {
  const result = document.getElementById('result');
  const challenge = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2,'0')).join('');
  const request = {operation:'CONNECTIVITY_ONLY', challenge};
  try {
    const response = await fetch('https://script.google.com/macros/s/AKfycbxl3s6R-ki5GOhoxhscgvWKe3n2r5PfWz-eeJKJalcwFxWTKQ2JBsE_Xm1lqdcxWos1/exec', {
      method:'POST', mode:'cors', credentials:'omit', referrerPolicy:'no-referrer', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(request)
    });
    const data = await response.json();
    result.textContent = response.ok && data.ok === true && data.synthetic === true && data.challenge === challenge
      ? 'PASS — réponse synthétique lue dans le navigateur, sans session Google.' : 'FAIL — réponse incorrecte.';
  } catch (_) { result.textContent = 'FAIL — réponse inaccessible depuis cette origine.'; }
})();
</script></body></html>
